; PlatformIO Project Configuration File — singleTest
;
; nfcSingle(../single) 의 화면만 떼어 본다 — 펀펀포인트 사진을 받아 원형 480 화면에 돌린다.
; 보드 정의·포트 찾기·모니터 설정은 single 과 같다.

[env:lilygo-t-rgb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
; 와이파이와 기기 키는 secrets/ChurchSecrets.h 에서 읽는다(깃 제외) — single 과 같다.
build_flags =
	-I ${PROJECT_DIR}/../../secrets
; 포트는 번호가 아니라 **보드의 시리얼**로 찾는다 — 까닭은 find_port.py 머리말에.
extra_scripts = pre:find_port.py
monitor_port = hwgrep://68:EE:8F:47:30:FC
monitor_speed = 115200
lib_deps =
	moononournation/GFX Library for Arduino
	bblanchon/ArduinoJson
	olikraus/U8g2
	; 설정 모드(portal.h)가 화면에 띄우는 접속용 QR — master 와 같다
	ricmoo/QRCode@^0.0.1
