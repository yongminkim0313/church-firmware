; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = huge_app.csv
; 포트는 번호가 아니라 **보드의 시리얼**로 찾는다 — 까닭은 find_port.py 머리말에.
; (화면 보드와 USB ID 가 같아서, 같이 꽂으면 자동 고르기가 엉뚱한 쪽을 잡는다)
extra_scripts = pre:find_port.py
monitor_port = hwgrep://9C:CC:01:7B:E3:78
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson
	adafruit/Adafruit PN532
	adafruit/Adafruit BusIO
