; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
; 공용 인증정보(secrets/ChurchSecrets.h) 가 있는 폴더. config.h 가 그것을 #include 한다 —
; 와이파이 비밀번호와 기기 키를 깃에 올리지 않으려고 밖으로 뺐다(그 파일은 .gitignore 대상).
; 처음 받아 간 뒤 한 번: cp secrets/ChurchSecrets.example.h secrets/ChurchSecrets.h
; ★ ${PROJECT_DIR} 로 적는다 — 상대경로는 PlatformIO 를 어느 폴더에서 돌리느냐에 딸려
;   헷갈리는데, 이 값은 늘 platformio.ini 가 있는 자리다.
build_flags =
	-I ${PROJECT_DIR}/../../secrets
; 포트는 번호가 아니라 **보드의 시리얼**로 찾는다 — 까닭은 find_port.py 머리말에.
extra_scripts = pre:find_port.py
; 모니터도 같은 보드로. 'hwgrep://' 는 pyserial 이 시리얼·설명을 훑어 포트를 찾아 준다.
monitor_port = hwgrep://68:EE:8F:47:30:FC
; 코드가 Serial.begin(115200) 이다. 안 적으면 PlatformIO 기본값 9600 으로 열려 글자가 깨진다.
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson
	links2004/WebSockets
	moononournation/GFX Library for Arduino
	olikraus/U8g2
