; funfunFirmware_v3 · 화면(display) — LILYGO T-RGB 2.1" 원형 (ESP32-S3 · ST7701S RGB 480×480 · CST820 터치)
;
; 카드는 리더 보드(../reader)가 읽고, 소리도 리더가 낸다. 이 보드는 서버와 말하고 그린다.
; 보드 설정·플랫폼은 nfcProject/master 와 같다 — RGB 패널을 몬 판이 검증된 그 조합이다.
;   pio run                    빌드
;   pio run -t upload          굽기 — find_port.py 가 시리얼(MAC)로 이 보드를 찾는다(리더와 USB ID 가 같다)
;   pio device monitor
[platformio]
default_envs = t-rgb

[env:t-rgb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
; 공용 인증정보(secrets/ChurchSecrets.h) — config.h 가 #include 한다(깃 제외).
; v3 는 firmware/funfunFirmware_v3/display 라 한 칸 더 깊다.
build_flags =
	-I ${PROJECT_DIR}/../../secrets
extra_scripts = pre:find_port.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	moononournation/GFX Library for Arduino@^1.6.9
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2@^2.36.5
	links2004/WebSockets@^2.6.1
	; 설정 모드(portal.h)가 화면에 띄우는 접속용 QR — 폰 카메라로 찍으면 그 AP 에 붙는다.
	ricmoo/QRCode@^0.0.1
