; funfunFirmware_v3 · 리더(reader) — ESP32-S3-DevKitC-1 N16R8 · PN532 · microSD · MAX98357A
;
; v2 의 그 보드에서 GC9A01 화면만 뗀 배선이다. 화면은 ../display(T-RGB)가 맡는다.
; 서버와 말하지 않아 secrets(ChurchSecrets.h)를 보지 않는다.
;   pio run -t upload    굽기 — find_port.py 가 시리얼(MAC)로 이 보드를 찾는다(화면과 USB ID 가 같다)
; ★ USB 는 보드의 'USB'(네이티브) 구멍에 — 'UART' 구멍은 굽기만 되고 시리얼이 조용하다.
[platformio]
default_envs = reader

[env:reader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
extra_scripts = pre:find_port.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit PN532@^1.3.4
	adafruit/Adafruit BusIO
