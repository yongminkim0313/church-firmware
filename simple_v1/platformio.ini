; simple_v1 — 펀펀포인트 한 보드 판 · Guition JC3248W535 (ESP32-S3 · AXS15231B QSPI 320×480 · 정전식 터치)
;
; funfunFirmware_v3 의 두 보드(화면 T-RGB + 리더 DevKitC)가 하던 일을 **이 보드 한 장**이 다 한다 —
; 이 보드에는 PN532 를 꽂을 4핀 커넥터(P3) · TF 슬롯 · 스피커 앰프(SPK)가 처음부터 달려 있다.
; 보드 설정은 heartHunter(같은 보드)와 같다 — 그 조합으로 화면·터치·SD·PN532(UART)가 돈 것을 확인했다.
;   pio run                    빌드
;   pio run -t upload          굽기 — find_port.py 가 시리얼(MAC)로 이 보드를 찾는다
;   pio device monitor
[platformio]
default_envs = jc3248

[env:jc3248]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; 이름이 곧 스펙: esp32s3 / 플래시·PSRAM 120MHz / 16MB flash / 8MB PSRAM / 플래시 QIO · PSRAM OPI
board = esp32s3_120_16_8-qio_opi
framework = arduino
; QSPI 패널은 부분 갱신이 안 돼 320×480 한 장(300KB)을 PSRAM 에 그렸다 통째로 보낸다 — PSRAM 필수.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
	; 네이티브 USB — 없으면 Serial 이 UART 핀으로 나가 모니터에 아무것도 안 보인다
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM
	; 공용 인증정보(secrets/ChurchSecrets.h) — config.h 가 #include 한다(깃 제외).
	-I ${PROJECT_DIR}/../secrets
extra_scripts = pre:find_port.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; ※ 보드 드라이버(lib/JC3248W535)는 레지스트리에 없어 직접 넣어 두었다(heartHunter 와 같은 것).
; ※ PN532 는 라이브러리 없이 UART(HSU)로 직접 말한다(src/nfc.cpp).
lib_deps =
	moononournation/GFX Library for Arduino@^1.6.9
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2@^2.36.5
	links2004/WebSockets@^2.6.1
	; 설정 모드(portal.h)가 화면에 띄우는 접속용 QR — 폰 카메라로 찍으면 그 AP 에 붙는다.
	ricmoo/QRCode@^0.0.1
