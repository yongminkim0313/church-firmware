; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 그냥 `pio run` 은 본 판을 굽는다 — 적어 두지 않으면 아래 두 판을 모두 굽고
; upload 가 두 번 나간다(뒤엣것이 이긴다). 소리만 시험하는 판은 -e yx5200test 로 고른다.
default_envs = esp32-s3-devkitc1-n16r8

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

; 16MB flash / 8MB 옥탈 PSRAM (N16R8)
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; 내장 USB-Serial/JTAG 포트로 Serial 출력
; ★ 보드에 USB-C 가 **둘**이다. 둘 다 구울 수는 있지만 Serial 이 보이는 쪽은 하나다:
;     USB  (네이티브 USB-Serial/JTAG · Espressif VID 0x303A) → 여기 꽂아야 글자가 보인다
;     UART (CH343 브리지 · WCH VID 0x1A86 "USB Single Serial") → 굽기만 되고 **조용하다**
;   위 두 플래그가 Serial 을 네이티브 쪽으로 보내서다. UART 쪽에 꽂으면 ROM 부팅 로그
;   (ESP-ROM:esp32s3…)만 나오고 그 뒤로 아무것도 안 나온다 — ROM 은 UART0 으로 찍기
;   때문이다. 기기가 멈춘 것이 아니다(시리얼로 보낸 명령도 앱에 닿지 않는다).
;   어느 쪽에 꽂혔는지: ioreg -p IOUSB -l -w 0 | grep "USB Vendor Name"
; 공용 인증정보(secrets/ChurchSecrets.h) 가 있는 폴더. config.h 가 그것을 #include 한다 —
; 와이파이 비밀번호와 기기 키를 깃에 올리지 않으려고 밖으로 뺐다(그 파일은 .gitignore 대상).
; 처음 받아 간 뒤 한 번: cp secrets/ChurchSecrets.example.h secrets/ChurchSecrets.h
; ★ ${PROJECT_DIR} 로 적는다 — 상대경로는 PlatformIO 를 어느 폴더에서 돌리느냐에 딸려
;   헷갈리는데, 이 값은 늘 platformio.ini 가 있는 자리다.
; 시험판(src/test_yx5200.cpp)은 본 판에서 뺀다 — 그 파일도 setup()/loop() 를 들고 있어
; 함께 구우면 링크가 'multiple definition' 으로 떨어진다. 아래 env:yx5200test 는 거꾸로
; 그 파일 하나만 굽는다.
build_src_filter = +<*> -<test_yx5200.cpp>

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-I ${PROJECT_DIR}/../secrets

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	moononournation/GFX Library for Arduino@^1.6.9
	adafruit/Adafruit PN532@^1.3.4
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2@^2.36.5
	links2004/WebSockets@^2.6.1

; ── 소리만 시험하는 판 ────────────────────────────────────────────
; YX5200(DFPlayer Mini) 만 달고 구울 때. 화면·PN532·와이파이를 통째로 빼고
; src/test_yx5200.cpp 하나만 굽는다 — 본 판은 PN532 를 못 찾으면 그 자리에서 서므로,
; 모듈만 달린 보드에서는 소리까지 가 보지도 못한다.
;   pio run -e yx5200test -t upload && pio device monitor -e yx5200test
; ★ extends 로 위 판의 설정을 그대로 물려받는다 — 보드·파티션·build_flags 를 베껴
;   두면 한쪽만 고쳐져, 시험판이 본 판과 다른 보드 설정으로 구워진다.
[env:yx5200test]
extends = env:esp32-s3-devkitc1-n16r8
build_src_filter = -<*> +<test_yx5200.cpp>
