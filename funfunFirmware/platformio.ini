; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

; 16MB flash / 8MB 옥탈 PSRAM (N16R8)
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; 내장 USB-Serial/JTAG 포트로 Serial 출력
; ★ 보드에 USB-C 가 **둘**이다. 둘 다 구울 수는 있지만 Serial 이 보이는 쪽은 하나다:
;     USB  (네이티브 USB-Serial/JTAG · Espressif VID 0x303A) → 여기 꽂아야 글자가 보인다
;     UART (CH343 브리지 · WCH VID 0x1A86 "USB Single Serial") → 굽기만 되고 **조용하다**
;   위 두 플래그가 Serial 을 네이티브 쪽으로 보내서다. UART 쪽에 꽂으면 ROM 부팅 로그
;   (ESP-ROM:esp32s3…)만 나오고 그 뒤로 아무것도 안 나온다 — ROM 은 UART0 으로 찍기
;   때문이다. 기기가 멈춘 것이 아니다(시리얼로 보낸 명령도 앱에 닿지 않는다).
;   어느 쪽에 꽂혔는지: ioreg -p IOUSB -l -w 0 | grep "USB Vendor Name"
; 공용 인증정보(secrets/ChurchSecrets.h) 가 있는 폴더. config.h 가 그것을 #include 한다 —
; 와이파이 비밀번호와 기기 키를 깃에 올리지 않으려고 밖으로 뺐다(그 파일은 .gitignore 대상).
; 처음 받아 간 뒤 한 번: cp secrets/ChurchSecrets.example.h secrets/ChurchSecrets.h
; ★ ${PROJECT_DIR} 로 적는다 — 상대경로는 PlatformIO 를 어느 폴더에서 돌리느냐에 딸려
;   헷갈리는데, 이 값은 늘 platformio.ini 가 있는 자리다.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-I ${PROJECT_DIR}/../secrets

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	moononournation/GFX Library for Arduino@^1.6.9
	adafruit/Adafruit PN532@^1.3.4
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2@^2.36.5
	links2004/WebSockets@^2.6.1
