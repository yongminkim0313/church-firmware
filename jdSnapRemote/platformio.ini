; 꾸미포토(jdSnap) 부스 리모컨 — ESP32-C3 SuperMini
;
; 단추 하나로 부스의 셔터를 누른다. 와이파이를 쓰지 않는다(까닭은 src/main.cpp 머리말).
; 굽기:  pio run -t upload    보기:  pio device monitor
;
; ★ 이 프로젝트는 secrets/ChurchSecrets.h 를 보지 않는다 — 와이파이도 서버도 기기 키도
;   쓰지 않기 때문이다. 받아 간 뒤 따로 채울 것이 없다.

[env:esp32-c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = huge_app.csv
; 포트는 번호가 아니라 **보드의 시리얼**로 찾는다 — nfcProject/slave 와 같은 C3 SuperMini 라
; USB ID(303A:1001)가 똑같아서, 둘을 같이 꽂으면 자동 고르기가 엉뚱한 쪽을 잡는다.
; find_port.py 의 BOARD_SERIAL 에 이 보드의 값을 적어 둘 것(`pio device list` 의 SER=).
extra_scripts = pre:find_port.py
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino@^2.1.0
