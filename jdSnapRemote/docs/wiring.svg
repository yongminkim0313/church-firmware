<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <rect width="1120" height="800" fill="#F7F7F5"/>

  <!-- 머리말 -->
  <text x="40" y="54" font-size="29" font-weight="700" fill="#15181A">꾸미포토 부스 리모컨 — 배선도</text>
  <text x="40" y="82" font-size="14.5" fill="#6B6F73">ESP32-C3 SuperMini · firmware/jdSnapRemote · 핀은 src/config.h 의 기본값</text>
  <text x="40" y="104" font-size="13.5" fill="#6B6F73">실선 = 반드시 잇는다 · 점선 = 선택</text>

  <!-- 아이패드 -->
  <rect x="900" y="48" width="170" height="118" rx="12" fill="#FFFFFF" stroke="#15181A" stroke-width="2.5"/>
  <rect x="914" y="62" width="142" height="82" rx="4" fill="#E8EAEC"/>
  <text x="985" y="100" font-size="14" font-weight="700" fill="#15181A" text-anchor="middle">아이패드</text>
  <text x="985" y="122" font-size="12.5" fill="#45494D" text-anchor="middle">/ 태블릿</text>
  <text x="985" y="188" font-size="12.5" fill="#6B6F73" text-anchor="middle">꾸미포토 앱</text>

  <!-- BLE 전파 -->
  <path d="M772 130 a 30 30 0 0 1 0 50" fill="none" stroke="#2D9556" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M790 118 a 46 46 0 0 1 0 74" fill="none" stroke="#2D9556" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M808 106 a 62 62 0 0 1 0 98" fill="none" stroke="#2D9556" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <text x="745" y="106" font-size="13.5" font-weight="700" fill="#2D9556" text-anchor="end">BLE — GATT 또는 HID</text>
  <text x="745" y="126" font-size="12" fill="#6B6F73" text-anchor="end">와이파이는 쓰지 않는다</text>
  <text x="745" y="144" font-size="12" fill="#6B6F73" text-anchor="end">(아이패드는 프린터 와이파이에 그대로)</text>

  <!-- 보드 -->
  <rect x="450" y="196" width="210" height="330" rx="12" fill="#15181A"/>
  <rect x="520" y="176" width="70" height="26" rx="6" fill="#8A9097"/>
  <text x="555" y="166" font-size="12.5" fill="#6B6F73" text-anchor="middle">USB-C · 5V 전원</text>
  <text x="555" y="242" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32-C3</text>
  <text x="555" y="264" font-size="13.5" fill="#B9BEC4" text-anchor="middle">SuperMini</text>

  <!-- 핀 이름은 보드 안에(실크 인쇄처럼) — 줄이 글자를 가로지르지 않게 -->
  <rect x="434" y="298" width="18" height="11" fill="#FFE451"/>
  <text x="462" y="307" font-size="13" font-weight="700" fill="#FFE451">GPIO3</text>
  <rect x="434" y="478" width="18" height="11" fill="#CFD3D7"/>
  <text x="462" y="487" font-size="13" font-weight="700" fill="#CFD3D7">GPIO5</text>
  <rect x="658" y="268" width="18" height="11" fill="#CFD3D7"/>
  <text x="648" y="277" font-size="13" font-weight="700" fill="#CFD3D7" text-anchor="end">GPIO4</text>
  <rect x="658" y="375" width="18" height="11" fill="#CFD3D7"/>
  <text x="648" y="384" font-size="13" font-weight="700" fill="#CFD3D7" text-anchor="end">GPIO10</text>
  <rect x="658" y="490" width="18" height="11" fill="#9AA0A6"/>
  <text x="648" y="499" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">GND</text>

  <!-- 온보드 LED 알림 -->
  <rect x="430" y="548" width="250" height="54" rx="10" fill="#FFF9DF" stroke="#E4C73F" stroke-width="2"/>
  <text x="555" y="571" font-size="12.5" font-weight="700" fill="#15181A" text-anchor="middle">온보드 LED = GPIO8 · LOW 에 켜진다</text>
  <text x="555" y="590" font-size="11.5" fill="#45494D" text-anchor="middle">따로 달 것 없이 보드에서 깜빡인다</text>

  <!-- 부스 단추 (필수) -->
  <rect x="112" y="266" width="142" height="74" rx="18" fill="#FFE451" stroke="#15181A" stroke-width="3"/>
  <circle cx="183" cy="303" r="21" fill="#F7D117" stroke="#15181A" stroke-width="2"/>
  <text x="183" y="364" font-size="14.5" font-weight="700" fill="#15181A" text-anchor="middle">부스 단추</text>
  <text x="183" y="384" font-size="12" fill="#45494D" text-anchor="middle">짧게 = 셔터</text>
  <text x="183" y="402" font-size="12" fill="#45494D" text-anchor="middle">길게(0.7초) = 처음으로</text>
  <path d="M254 286 H 340 V 303 H 434" fill="none" stroke="#15181A" stroke-width="2.5"/>
  <path d="M254 320 H 300 V 634" fill="none" stroke="#15181A" stroke-width="2.5"/>

  <!-- 둘째 단추 (선택) -->
  <rect x="112" y="450" width="142" height="62" rx="16" fill="#F2F2F3" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="183" cy="481" r="17" fill="#E3E4E6" stroke="#15181A" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="183" y="536" font-size="13.5" font-weight="700" fill="#15181A" text-anchor="middle">둘째 단추 (선택)</text>
  <text x="183" y="555" font-size="12" fill="#45494D" text-anchor="middle">누르면 바로 '처음으로'</text>
  <text x="183" y="573" font-size="11.5" fill="#6B6F73" text-anchor="middle">PIN_BUTTON_BACK 을 5 로</text>
  <path d="M254 468 H 350 V 483 H 434" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M254 498 H 270 V 634" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- 단추 안 LED (선택) -->
  <text x="745" y="246" font-size="13.5" font-weight="700" fill="#15181A">단추 안 LED (선택)</text>
  <path d="M676 273 H 745" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M745 262 L 745 284 L 764 273 Z" fill="#15181A"/>
  <path d="M764 261 V 285" fill="none" stroke="#15181A" stroke-width="2.5"/>
  <path d="M764 273 H 778" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="778" y="264" width="46" height="18" fill="#FFFFFF" stroke="#15181A" stroke-width="2.5"/>
  <text x="676" y="306" font-size="11.5" fill="#6B6F73">330Ω · config.h 의 PIN_LED 를 4 로</text>

  <!-- 부저 (선택) -->
  <path d="M676 380 H 755" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="783" cy="380" r="28" fill="#F2F2F3" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="783" y="388" font-size="21" fill="#15181A" text-anchor="middle">♪</text>
  <text x="783" y="430" font-size="13.5" font-weight="700" fill="#15181A" text-anchor="middle">부저 (선택)</text>
  <text x="783" y="449" font-size="11.5" fill="#6B6F73" text-anchor="middle">PIN_BUZZER 를 10 으로</text>
  <text x="783" y="467" font-size="11.5" fill="#6B6F73" text-anchor="middle">GATT 모드에서만 울린다</text>

  <!-- 선택 가지 둘의 GND — 오른쪽 끝 한 길로 함께 내려간다(글자를 가로지르지 않게) -->
  <path d="M824 273 H 965 V 634" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M811 380 H 965" fill="none" stroke="#15181A" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="965" cy="380" r="4.5" fill="#15181A"/>

  <!-- 보드 GND -->
  <path d="M676 495 H 710 V 634" fill="none" stroke="#15181A" stroke-width="2.5"/>

  <!-- GND 레일 -->
  <path d="M250 634 H 980" fill="none" stroke="#15181A" stroke-width="3"/>
  <path d="M390 634 V 652 M 374 652 H 406 M 379 660 H 401 M 385 668 H 395" fill="none" stroke="#15181A" stroke-width="3" stroke-linecap="round"/>
  <text x="418" y="662" font-size="13" font-weight="700" fill="#15181A">GND (공통)</text>

  <!-- 주의 -->
  <rect x="40" y="700" width="1040" height="80" rx="10" fill="#FFF9DF" stroke="#E4C73F" stroke-width="2"/>
  <text x="60" y="726" font-size="13" fill="#15181A">⚠ GPIO2 · 8 · 9 에는 단추를 달지 마세요 — 부팅 스트래핑 핀이라, 켜는 순간 눌려 있으면 보드가 다운로드 모드로</text>
  <text x="74" y="746" font-size="13" fill="#15181A">들어가 펌웨어가 돌지 않습니다. GPIO18 · 19 는 USB 라 쓸 수 없습니다.</text>
  <text x="60" y="768" font-size="13" fill="#15181A">⚠ 단추에 저항은 필요 없습니다 — 핀의 내부 풀업을 쓰므로 GND 로만 떨어뜨리면 됩니다.</text>
</svg>
