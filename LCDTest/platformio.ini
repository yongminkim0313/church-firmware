; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

; 16MB flash / 8MB 옥탈 PSRAM (N16R8)
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; 내장 USB-Serial/JTAG 포트로 Serial 출력
; 공용 인증정보(secrets/ChurchSecrets.h) 가 있는 폴더. config.h 가 그것을 #include 한다 —
; 와이파이 비밀번호와 기기 키를 깃에 올리지 않으려고 밖으로 뺐다(그 파일은 .gitignore 대상).
; 처음 받아 간 뒤 한 번: cp secrets/ChurchSecrets.example.h secrets/ChurchSecrets.h
; ★ ${PROJECT_DIR} 로 적는다 — 상대경로는 PlatformIO 를 어느 폴더에서 돌리느냐에 딸려
;   헷갈리는데, 이 값은 늘 platformio.ini 가 있는 자리다.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-I ${PROJECT_DIR}/../secrets

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	moononournation/GFX Library for Arduino@^1.6.9
	adafruit/Adafruit PN532@^1.3.4
	bblanchon/ArduinoJson@^7.4.2
	olikraus/U8g2@^2.36.5
	links2004/WebSockets@^2.6.1
